services:
  - type: web
    name: equipment-system
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      cd backend && pip install -r requirements.txt &&
      cd ../frontend && npm install -g pnpm && pnpm install && pnpm build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATABASE_URL
        value: sqlite:///./data/equipment.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: RENDER
        value: "true"
    disk:
      - name: equipment-data
        mountPath: /opt/render/project/src/backend/data
        sizeGB: 1
